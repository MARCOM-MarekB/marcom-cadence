<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#37436f">
  <title>Cadence</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Cadence</h1>
    </header>

    <section class="status" id="status" aria-live="polite">
      <p class="status-state" id="status-state">Loading</p>
      <p class="status-detail" id="status-detail"></p>
      <p class="status-training" id="status-training"></p>
    </section>

    <section class="week" aria-labelledby="week-heading">
      <h2 id="week-heading">This week</h2>
      <div class="day-labels" id="day-labels" aria-hidden="true"></div>
      <div class="bar" id="week-bar" aria-hidden="true"></div>
      <div class="legend" aria-hidden="true">
        <span><i class="swatch swatch-fast"></i>Fast</span>
        <span><i class="swatch swatch-eat"></i>Eat</span>
        <span><i class="swatch swatch-training"></i>Training</span>
      </div>
    </section>

    <ul class="periods" id="periods"></ul>
  </main>
</body>
</html>
