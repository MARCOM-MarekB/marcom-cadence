<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#37436f">
  <title>Cadence</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="#today"><img class="brand-icon" src="favicon.svg" alt="">Cadence</a>
      <nav class="nav" data-i18n-aria-label="nav.label">
        <a href="#today" data-view-link="today" data-i18n="nav.today"></a>
        <a href="#week" data-view-link="week" data-i18n="nav.week"></a>
        <a href="#diet" data-view-link="diet" data-i18n="nav.diet"></a>
        <a href="#shopping" data-view-link="shopping" data-i18n="nav.shopping"></a>
        <a href="#training" data-view-link="training" data-i18n="nav.training"></a>
        <a href="#measurements" data-view-link="measurements" data-i18n="nav.measurements"></a>
      </nav>
      <div class="controls">
        <button class="control" id="language-toggle" type="button" data-i18n="language.switch" data-i18n-aria-label="language.switchLabel"></button>
        <button class="control" id="theme-toggle" type="button"></button>
      </div>
    </header>

    <main>
      <section class="view" data-view="today" hidden>
        <div class="status" id="status">
          <p class="status-state" id="status-state"></p>
          <div class="progress" aria-hidden="true"><div class="progress-value" id="status-progress"></div></div>
        </div>
        <div class="timers">
          <div class="timer">
            <p class="timer-label" id="timer-fast-label"></p>
            <p class="timer-value" id="timer-fast"></p>
            <p class="timer-detail" id="timer-fast-detail"></p>
          </div>
          <div class="timer">
            <p class="timer-label" id="timer-meal-label"></p>
            <p class="timer-value" id="timer-meal"></p>
            <p class="timer-detail" id="timer-meal-detail"></p>
          </div>
          <div class="timer">
            <p class="timer-label" id="timer-training-label"></p>
            <p class="timer-value" id="timer-training"></p>
            <p class="timer-detail" id="timer-training-detail"></p>
          </div>
        </div>
        <div data-week-bar></div>
        <button class="control hours-toggle" type="button" data-hours-toggle></button>
        <div id="today-meals"></div>
      </section>

      <section class="view" data-view="week" hidden>
        <h2 data-i18n="week.title"></h2>
        <div data-week-bar></div>
        <button class="control hours-toggle" type="button" data-hours-toggle></button>
        <ul class="periods" id="periods"></ul>
      </section>

      <section class="view" data-view="diet" hidden>
        <h2 data-i18n="diet.title"></h2>
        <div class="diet-summary">
          <p id="diet-week-total"></p>
          <p class="empty" data-i18n="diet.estimate"></p>
        </div>
        <div class="diet-day-picker" id="diet-day-picker"></div>
        <button class="control hours-toggle" type="button" data-hours-toggle></button>
        <div class="diet-days" id="diet-days"></div>
      </section>

      <section class="view" data-view="shopping" hidden>
        <h2 data-i18n="shopping.title"></h2>
        <div class="shopping-controls">
          <p class="timer-label" data-i18n="shopping.days"></p>
          <div class="shopping-days" id="shopping-days"></div>
          <p class="timer-label" data-i18n="shopping.layout"></p>
          <div class="shopping-days" id="shopping-layout"></div>
          <p class="timer-label" data-i18n="shopping.sort"></p>
          <div class="shopping-days" id="shopping-sort"></div>
          <p class="timer-label" data-i18n="shopping.basket"></p>
          <div class="shopping-days" id="shopping-basket-filter"></div>
          <p class="timer-label" data-i18n="shopping.sushi"></p>
          <div class="shopping-days" id="shopping-sushi"></div>
        </div>
        <div class="diet-summary">
          <p id="shopping-summary"></p>
          <p class="empty" data-i18n="shopping.spices"></p>
          <p class="shopping-basket" id="shopping-basket" role="status"></p>
        </div>
        <div class="shopping-list" id="shopping-list"></div>
        <div class="shopping-actions">
          <button class="control" id="shopping-check-all" type="button" data-i18n="shopping.checkAll"></button>
          <button class="control" id="shopping-uncheck-all" type="button" data-i18n="shopping.uncheckAll"></button>
          <button class="control" id="shopping-copy" type="button" data-i18n="shopping.copy"></button>
          <button class="control" id="shopping-print" type="button" data-i18n="shopping.print"></button>
        </div>
      </section>

      <section class="view" data-view="training" hidden>
        <h2 data-i18n="training.title"></h2>
        <div class="set-panel is-idle" id="set-panel">
          <p class="set-name" id="set-name"></p>
          <p class="set-phase" id="set-phase"></p>
          <p class="set-time" id="set-time"></p>
          <p class="set-count" id="set-count"></p>
        </div>

        <div class="set-actions">
          <button class="control set-primary" id="set-complete" type="button" data-i18n="setTimer.complete" hidden></button>
          <button class="control set-primary" id="set-skip" type="button" data-i18n="setTimer.skip" hidden></button>
          <button class="control" id="set-pause" type="button" hidden></button>
          <button class="control" id="set-reset" type="button" data-i18n="setTimer.reset" hidden></button>
        </div>

        <form class="set-settings" id="set-settings">
          <label class="measure-field set-exercise" for="set-exercise">
            <span class="measure-name" data-i18n="setTimer.exercise"></span>
            <input id="set-exercise" type="text" maxlength="60">
          </label>
          <label class="measure-field" for="set-work">
            <span class="measure-name" data-i18n="setTimer.work"></span>
            <input id="set-work" type="number" inputmode="numeric" min="0" step="5" required>
          </label>
          <label class="measure-field" for="set-rest">
            <span class="measure-name" data-i18n="setTimer.rest"></span>
            <input id="set-rest" type="number" inputmode="numeric" min="0" step="5" required>
          </label>
          <label class="measure-field" for="set-sets">
            <span class="measure-name" data-i18n="setTimer.sets"></span>
            <input id="set-sets" type="number" inputmode="numeric" min="1" step="1" required>
          </label>
          <p class="empty set-hint" data-i18n="setTimer.hint"></p>
          <button class="control set-primary set-start" type="submit" data-i18n="setTimer.start"></button>
        </form>
      </section>

      <section class="view" data-view="measurements" hidden>
        <h2 data-i18n="measurements.title"></h2>
        <div class="measure-layout">
          <svg class="figure" viewBox="0 0 360 450" role="group" data-i18n-aria-label="measurements.figureLabel">
            <image href="img/figure.png" x="67.5" y="0" width="225" height="450" aria-hidden="true"/>
            <g id="figure-points"></g>
          </svg>

          <form class="measure-form" id="measure-form">
            <label class="measure-field" for="measure-date">
              <span class="measure-name" data-i18n="measurements.date"></span>
              <input id="measure-date" type="date" required>
            </label>
            <label class="measure-field" for="measure-time">
              <span class="measure-name" data-i18n="measurements.time"></span>
              <input id="measure-time" type="time" required>
            </label>
            <div class="measure-fields" id="measure-fields"></div>
            <div class="measure-actions">
              <button class="control measure-save" type="submit" data-i18n="measurements.save"></button>
              <span class="empty" id="measure-status" role="status"></span>
            </div>
          </form>
        </div>

        <p class="empty" data-i18n="measurements.privacy"></p>
        <ul class="measure-changes" id="measure-changes"></ul>

        <h3 data-i18n="measurements.history"></h3>
        <p class="empty" id="measure-empty" data-i18n="measurements.empty"></p>
        <ul class="measure-history" id="measure-history"></ul>
      </section>
    </main>
  </div>
</body>
</html>
