<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#37436f">
  <title>Cadence</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="login" id="login" hidden>
    <form class="measure-form login-form" id="login-form">
      <h1 class="login-title"><img class="brand-icon" src="favicon.svg" alt="">Cadence</h1>
      <label class="measure-field" for="login-email">
        <span class="measure-name" data-i18n="login.email"></span>
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label class="measure-field" for="login-password">
        <span class="measure-name" data-i18n="login.password"></span>
        <span class="password-box">
          <input id="login-password" type="password" autocomplete="current-password" required>
          <button class="control password-toggle" id="login-password-toggle" type="button" aria-pressed="false">
            <svg class="password-icon-show" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="password-icon-hide" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M3 3l18 18"/>
            </svg>
          </button>
        </span>
      </label>
      <div class="measure-actions">
        <button class="control measure-save" id="login-submit" type="submit" data-i18n="login.submit"></button>
        <span class="empty" id="login-status" role="status"></span>
      </div>
    </form>
  </main>

  <div class="wrap" id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#today"><img class="brand-icon" src="favicon.svg" alt="">Cadence</a>
      <nav class="nav" data-i18n-aria-label="nav.label">
        <a href="#today" data-view-link="today" data-i18n="nav.today"></a>
        <a href="#week" data-view-link="week" data-i18n="nav.week"></a>
        <a href="#diet" data-view-link="diet" data-i18n="nav.diet"></a>
        <a href="#shopping" data-view-link="shopping" data-i18n="nav.shopping"></a>
        <a href="#training" data-view-link="training" data-i18n="nav.training"></a>
        <a href="#measurements" data-view-link="measurements" data-i18n="nav.measurements"></a>
      </nav>
      <div class="controls">
        <button class="control" id="language-toggle" type="button" data-i18n="language.switch" data-i18n-aria-label="language.switchLabel"></button>
        <button class="control" id="theme-toggle" type="button"></button>
        <button class="control" id="sign-out" type="button" data-i18n="login.signOut"></button>
      </div>
    </header>

    <main>
      <section class="view" data-view="today" hidden>
        <div class="status" id="status">
          <p class="status-state" id="status-state"></p>
          <div class="progress" aria-hidden="true"><div class="progress-value" id="status-progress"></div></div>
        </div>
        <div class="timers">
          <div class="timer">
            <p class="timer-label" id="timer-fast-label"></p>
            <p class="timer-value" id="timer-fast"></p>
            <p class="timer-detail" id="timer-fast-detail"></p>
          </div>
          <a class="timer timer-link" href="#diet" id="timer-meal-card">
            <p class="timer-label" id="timer-meal-label"></p>
            <p class="timer-value" id="timer-meal"></p>
            <p class="timer-detail" id="timer-meal-detail"></p>
          </a>
          <div class="timer">
            <p class="timer-label" id="timer-training-label"></p>
            <p class="timer-value" id="timer-training"></p>
            <p class="timer-detail" id="timer-training-detail"></p>
          </div>
        </div>
        <div data-week-bar></div>
        <button class="control hours-toggle" type="button" data-hours-toggle></button>
        <div id="today-meals"></div>
      </section>

      <section class="view" data-view="week" hidden>
        <h2 data-i18n="week.title"></h2>
        <div data-week-bar></div>
        <button class="control hours-toggle" type="button" data-hours-toggle></button>
        <ul class="periods" id="periods"></ul>
      </section>

      <section class="view" data-view="diet" hidden>
        <h2 data-i18n="diet.title"></h2>
        <div class="diet-summary">
          <p id="diet-week-total"></p>
          <p class="empty" data-i18n="diet.estimate"></p>
        </div>
        <div class="diet-day-picker" id="diet-day-picker"></div>
        <button class="control hours-toggle" type="button" data-hours-toggle></button>
        <div class="diet-days" id="diet-days"></div>
      </section>

      <section class="view" data-view="shopping" hidden>
        <h2 data-i18n="shopping.title"></h2>
        <div class="shopping-controls">
          <p class="timer-label" data-i18n="shopping.days"></p>
          <div class="shopping-days" id="shopping-days"></div>
          <p class="timer-label" data-i18n="shopping.layout"></p>
          <div class="shopping-days" id="shopping-layout"></div>
          <p class="timer-label" data-i18n="shopping.sort"></p>
          <div class="shopping-days" id="shopping-sort"></div>
          <p class="timer-label" data-i18n="shopping.basket"></p>
          <div class="shopping-days" id="shopping-basket-filter"></div>
          <p class="timer-label" data-i18n="shopping.sushi"></p>
          <div class="shopping-days" id="shopping-sushi"></div>
        </div>
        <div class="diet-summary">
          <p id="shopping-summary"></p>
          <p class="empty" data-i18n="shopping.spices"></p>
          <p class="shopping-basket" id="shopping-basket" role="status"></p>
        </div>
        <div class="shopping-list" id="shopping-list"></div>
        <div class="shopping-actions">
          <button class="control" id="shopping-check-all" type="button" data-i18n="shopping.checkAll"></button>
          <button class="control" id="shopping-uncheck-all" type="button" data-i18n="shopping.uncheckAll"></button>
          <button class="control" id="shopping-copy" type="button" data-i18n="shopping.copy"></button>
          <button class="control" id="shopping-print" type="button" data-i18n="shopping.print"></button>
        </div>
      </section>

      <section class="view" data-view="training" hidden>
        <h2 data-i18n="training.title"></h2>
        <div class="tabs" data-i18n-aria-label="training.tabsLabel">
          <button class="control" type="button" data-training-tab="timer" data-i18n="training.tab.timer"></button>
          <button class="control" type="button" data-training-tab="log" data-i18n="training.tab.log"></button>
          <button class="control" type="button" data-training-tab="maxes" data-i18n="training.tab.maxes"></button>
          <button class="control" type="button" data-training-tab="exercises" data-i18n="training.tab.exercises"></button>
          <button class="control" type="button" data-training-tab="schedule" data-i18n="training.tab.schedule"></button>
        </div>

        <div class="tab-panel" data-training-panel="timer">
        <div class="set-panel is-idle" id="set-panel">
          <p class="set-name" id="set-name"></p>
          <p class="set-phase" id="set-phase"></p>
          <p class="set-time" id="set-time"></p>
          <p class="set-count" id="set-count"></p>
        </div>

        <div class="set-actions">
          <button class="control set-primary" id="set-complete" type="button" data-i18n="setTimer.complete" hidden></button>
          <button class="control set-primary" id="set-skip" type="button" data-i18n="setTimer.skip" hidden></button>
          <button class="control" id="set-pause" type="button" hidden></button>
          <button class="control" id="set-reset" type="button" data-i18n="setTimer.reset" hidden></button>
        </div>

        <form class="set-settings" id="set-settings">
          <label class="measure-field set-exercise" for="set-exercise">
            <span class="measure-name" data-i18n="setTimer.exercise"></span>
            <input id="set-exercise" type="text" maxlength="60">
          </label>
          <label class="measure-field" for="set-work">
            <span class="measure-name" data-i18n="setTimer.work"></span>
            <input id="set-work" type="number" inputmode="numeric" min="0" step="5" required>
          </label>
          <label class="measure-field" for="set-rest">
            <span class="measure-name" data-i18n="setTimer.rest"></span>
            <input id="set-rest" type="number" inputmode="numeric" min="0" step="5" required>
          </label>
          <label class="measure-field" for="set-sets">
            <span class="measure-name" data-i18n="setTimer.sets"></span>
            <input id="set-sets" type="number" inputmode="numeric" min="1" step="1" required>
          </label>
          <p class="empty set-hint" data-i18n="setTimer.hint"></p>
          <button class="control set-primary set-start" type="submit" data-i18n="setTimer.start"></button>
        </form>
        </div>

        <div class="tab-panel" data-training-panel="log" hidden>
          <div class="measure-actions">
            <button class="control measure-save" id="workout-new" type="button" data-i18n="workouts.new"></button>
            <button class="control" id="workout-copy-last" type="button" data-i18n="workouts.copyLast"></button>
            <span class="empty" id="workout-status" role="status"></span>
          </div>

          <form class="measure-form" id="workout-form" hidden>
            <h3 class="form-title" id="workout-form-title"></h3>
            <div class="workout-head">
              <label class="measure-field" for="workout-started">
                <span class="measure-name" data-i18n="workouts.started"></span>
                <input id="workout-started" type="datetime-local" required>
              </label>
              <label class="measure-field" for="workout-duration">
                <span class="measure-name" data-i18n="workouts.duration"></span>
                <input id="workout-duration" type="number" inputmode="numeric" min="1" step="5">
              </label>
            </div>
            <label class="measure-field" for="workout-notes">
              <span class="measure-name" data-i18n="workouts.notes"></span>
              <textarea id="workout-notes" rows="2" maxlength="1000"></textarea>
            </label>
            <ol class="workout-items" id="workout-items"></ol>
            <div class="workout-add measure-field">
              <select id="workout-exercise-picker" data-i18n-aria-label="workouts.pickExercise"></select>
              <button class="control" id="workout-add-exercise" type="button" data-i18n="workouts.addExercise"></button>
            </div>
            <p class="empty" id="workout-no-exercises" data-i18n="workouts.noExercises" hidden></p>
            <div class="measure-actions">
              <button class="control measure-save" id="workout-save" type="submit" data-i18n="workouts.save"></button>
              <button class="control" id="workout-cancel" type="button" data-i18n="workouts.cancel"></button>
              <button class="control" id="workout-delete" type="button" data-i18n="workouts.delete" hidden></button>
            </div>
          </form>

          <p class="empty" id="workout-empty" data-i18n="workouts.empty" hidden></p>
          <ul class="measure-history" id="workout-list"></ul>
        </div>

        <div class="tab-panel" data-training-panel="maxes" hidden>
          <p class="empty" data-i18n="maxes.intro"></p>
          <p class="empty" id="maxes-status" role="status"></p>
          <p class="empty" id="maxes-empty" data-i18n="maxes.empty" hidden></p>
          <ul class="measure-history" id="maxes-list"></ul>
        </div>

        <div class="tab-panel" data-training-panel="schedule" hidden>
          <form class="measure-form schedule-form" id="schedule-form">
            <p class="empty" data-i18n="schedule.intro"></p>
            <p class="empty" id="schedule-valid-from"></p>
            <ol class="set-list" id="schedule-sessions"></ol>
            <button class="control progression-add" id="schedule-add" type="button" data-i18n="schedule.add"></button>
            <div class="measure-actions">
              <button class="control measure-save" id="schedule-save" type="submit" data-i18n="schedule.save"></button>
              <span class="empty" id="schedule-status" role="status"></span>
            </div>
          </form>
        </div>

        <div class="tab-panel" data-training-panel="exercises" hidden>
          <div class="exercise-layout">
            <form class="measure-form" id="exercise-form">
              <h3 class="form-title" id="exercise-form-title"></h3>
              <div class="measure-field">
                <span class="measure-name" data-i18n="exercises.name"></span>
                <div class="lang-pair">
                  <input id="exercise-name-en" type="text" maxlength="80" placeholder="EN" data-i18n-aria-label="exercises.name.en">
                  <input id="exercise-name-pl" type="text" maxlength="80" placeholder="PL" data-i18n-aria-label="exercises.name.pl">
                </div>
              </div>
              <label class="measure-field" for="exercise-metric">
                <span class="measure-name" data-i18n="exercises.metric"></span>
                <select id="exercise-metric">
                  <option value="reps" data-i18n="exercise.metric.reps"></option>
                  <option value="weight" data-i18n="exercise.metric.weight"></option>
                  <option value="bodyweight" data-i18n="exercise.metric.bodyweight"></option>
                  <option value="hold" data-i18n="exercise.metric.hold"></option>
                </select>
              </label>
              <label class="check-field">
                <input id="exercise-per-side" type="checkbox">
                <span data-i18n="exercises.perSide"></span>
              </label>
              <div class="measure-field">
                <span class="measure-name" data-i18n="exercises.progressions"></span>
                <ol class="progression-list" id="exercise-progressions"></ol>
                <button class="control progression-add" id="exercise-add-progression" type="button" data-i18n="exercises.addProgression"></button>
              </div>
              <div class="measure-field">
                <span class="measure-name" data-i18n="exercises.notes"></span>
                <div class="lang-pair">
                  <textarea id="exercise-notes-en" rows="2" maxlength="500" placeholder="EN" data-i18n-aria-label="exercises.notes.en"></textarea>
                  <textarea id="exercise-notes-pl" rows="2" maxlength="500" placeholder="PL" data-i18n-aria-label="exercises.notes.pl"></textarea>
                </div>
              </div>
              <label class="check-field" id="exercise-archived-field" hidden>
                <input id="exercise-archived" type="checkbox">
                <span data-i18n="exercises.archived"></span>
              </label>
              <div class="measure-actions">
                <button class="control measure-save" id="exercise-save" type="submit" data-i18n="exercises.save"></button>
                <button class="control" id="exercise-cancel" type="button" data-i18n="exercises.cancel" hidden></button>
                <button class="control" id="exercise-delete" type="button" data-i18n="exercises.delete" hidden></button>
                <span class="empty" id="exercise-status" role="status"></span>
              </div>
            </form>

            <div class="exercise-catalog">
              <label class="check-field">
                <input id="exercise-show-archived" type="checkbox">
                <span data-i18n="exercises.showArchived"></span>
              </label>
              <p class="empty" id="exercise-empty" data-i18n="exercises.empty" hidden></p>
              <ul class="measure-history" id="exercise-list"></ul>
            </div>
          </div>
        </div>

        <div class="training-transfer">
          <p class="empty" data-i18n="transfer.intro"></p>
          <div class="measure-actions">
            <button class="control" id="training-export" type="button" data-i18n="transfer.export"></button>
            <button class="control" id="training-import" type="button" data-i18n="transfer.import"></button>
            <input id="training-import-file" type="file" accept="application/json,.json" hidden>
            <span class="empty" id="training-transfer-status" role="status"></span>
          </div>
        </div>
      </section>

      <section class="view" data-view="measurements" hidden>
        <h2 data-i18n="measurements.title"></h2>
        <div class="measure-layout">
          <svg class="figure" viewBox="0 0 360 450" role="group" data-i18n-aria-label="measurements.figureLabel">
            <image href="img/figure.png" x="67.5" y="0" width="225" height="450" aria-hidden="true"/>
            <g id="figure-points"></g>
          </svg>

          <form class="measure-form" id="measure-form">
            <label class="measure-field" for="measure-date">
              <span class="measure-name" data-i18n="measurements.date"></span>
              <input id="measure-date" type="date" required>
            </label>
            <label class="measure-field" for="measure-time">
              <span class="measure-name" data-i18n="measurements.time"></span>
              <input id="measure-time" type="time" required>
            </label>
            <div class="measure-fields" id="measure-fields"></div>
            <div class="measure-actions">
              <button class="control measure-save" type="submit" data-i18n="measurements.save"></button>
              <span class="empty" id="measure-status" role="status"></span>
            </div>
          </form>
        </div>

        <p class="empty" data-i18n="measurements.privacy"></p>
        <ul class="measure-changes" id="measure-changes"></ul>

        <h3 data-i18n="measurements.history"></h3>
        <p class="empty" id="measure-empty" data-i18n="measurements.empty"></p>
        <ul class="measure-history" id="measure-history"></ul>
      </section>
    </main>
  </div>
</body>
</html>
